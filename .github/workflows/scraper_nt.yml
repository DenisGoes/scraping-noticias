nome: Scraper Notícias

on:
  schedule:
    - cron: "0 9 * * *" #Executar todos os dias às 06:00
  workflow_dispatch:

jobs:
  scraper:
    runs-on: ubuntu-latest
  
  steps:
  - name: Baixar código
    uses: actions/checkout@v4

  - name: Configurar Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"

  - name: Instalar dependências
    run: | 
      python -m pip install --upgrade pip
      pip install -r requirements.txt

  - name: Instalar Chromium do Playwright
    run: |
      playwright install chromium --with-deps

  - name: Executar scraper
    env:  
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      API_TOKEN: ${{ secrets.API_TOKEN }}
      ID_CANAL: ${{ secrets.CANAL_ID }}
    run: python -m backend.scripts.run_tecnoblog #Alterar para rodar todos os scrapers em um só script
    
