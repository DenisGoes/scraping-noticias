- name: Verificar DATABASE_URL
  env:
    DATABASE_URL: ${{ secrets.DATABASE_URL }}
  run: |
    python - <<'PY'
    import os

    url = os.getenv("DATABASE_URL")

    print("DATABASE_URL existe:", bool(url))

    if url:
        print("Começa com:", url.split("://")[0] if "://" in url else "SEM PROTOCOLO")
        print("Possui @:", "@" in url)
        print("Possui :", ":" in url)
        print("Tamanho:", len(url))
    PY